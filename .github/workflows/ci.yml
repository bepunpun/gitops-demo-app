name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only prove the image builds; main also publishes it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: GIT_SHA=${{ steps.meta.outputs.tag }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The only "deploy" step in CI: record the new image tag in the config repo.
  # Nothing here touches a server; the GitOps agent picks the change up from git.
  update-config:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bepunpun/gitops-demo-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump the staging image tag
        run: |
          ./scripts/set-image-tag.sh staging "${{ needs.image.outputs.tag }}"
          git config user.name "gitops-ci-bot"
          git config user.email "gitops-ci-bot@users.noreply.github.com"
          git commit -am "ci: staging -> ${{ needs.image.outputs.tag }}"
          git push
